name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.123.7
      HUGO_ENVIRONMENT: production
    steps:
      - name: Check out website and theme
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install Hugo
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "928a767c403393f6abb204b69c27489abc78816dafd80901eb9a9f5f835972bc  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
      - name: Build website
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: hugo --buildDrafts
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
